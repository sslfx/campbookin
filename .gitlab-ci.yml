image: golang:1.25

stages:
  - lint
  - test
  - build

lint:
  stage: lint
  image: golangci/golangci-lint:latest-alpine
  script:
    - golangci-lint run -v
  allow_failure: true

run_tests:
  stage: test
  services:
    - name: redis:7-alpine
      alias: redis
  script:
    - go mod download
    - go test -v -coverprofile=coverage.txt ./...
    - head -n 1 coverage.txt > coverage_filtered.txt
    - grep -E "campbookin/internal/services/(admin|notification|registration)" coverage.txt >> coverage_filtered.txt

    - go tool cover -func=coverage_filtered.txt
    - |
      TOTAL_COVERAGE=$(go tool cover -func=coverage_filtered.txt | grep total | awk '{print $3}' | sed 's/%//')
      echo "Total coverage (Target Microservices Only): $TOTAL_COVERAGE%"
      THRESHOLD=30.0
      IS_LOW=$(echo "$TOTAL_COVERAGE $THRESHOLD" | awk '{if ($1 < $2) print 1; else print 0}')
      
      if [ "$IS_LOW" -eq "1" ]; then
        echo "FAIL: Покрытие $TOTAL_COVERAGE% ниже допустимых $THRESHOLD%"
        exit 1
      else
        echo "SUCCESS: Покрытие в норме"
      fi
  artifacts:
    paths:
      - coverage.txt
      - coverage_filtered.txt
    expire_in: 1 week

build_project:
  stage: build
  script:
    - mkdir -p bin
    - go build -o bin/admin ./cmd/admin/main.go
    - go build -o bin/gateway ./cmd/gateway/main.go
    - go build -o bin/notification ./cmd/notification/main.go