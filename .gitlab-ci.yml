image: golang:1.25

stages:
  - lint
  - test
  - build

lint:
  stage: lint
  image: golangci/golangci-lint:latest-alpine
  script:
    - golangci-lint run -v
  allow_failure: true

run_tests:
  stage: test
  services:
    - name: redis:7-alpine
      alias: redis
  script:
    - go mod download
    - go test -v -coverprofile=coverage.txt ./...
    - go tool cover -func=coverage.txt
  artifacts:
    paths:
      - coverage.txt
    expire_in: 1 week

build_project:
  stage: build
  script:
    - mkdir -p bin
    - go build -o bin/admin ./cmd/admin/main.go
    - go build -o bin/gateway ./cmd/gateway/main.go
    - go build -o bin/notification ./cmd/notification/main.go