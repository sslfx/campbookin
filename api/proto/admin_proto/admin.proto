syntax = "proto3";
import "google/protobuf/timestamp.proto";
option go_package = "campbookin/api/proto_output";

message Camp{
  string id = 1;
  string name = 2;
  string description = 3;
  string address = 4;

}
enum Status {
  SHIFT_UNKNOWN = 0;
  SHIFT_ACTIVE = 1;
  SHIFT_INACTIVE = 2;
}
message Shift {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  int32 capacity = 5;
  int32 price = 6;
  string camp_id = 7;
  Status status = 8;
}


message UpdateCampRequest{
  string id = 1;
  string name = 2;
  string description = 3;
  string address = 4;
}
message UpdateCampResponse{
  bool success = 1;
}
message GetCampRequest{
  string id = 1;
}
message GetCampResponse{
  Camp camp = 1;
}
message CreateCampRequest{
  string name = 3;
  string description = 4;
  string address = 5;
}
message CreateCampResponse{
  string id = 1;
}
message DeleteCampRequest{
  string id = 1;
}
message DeleteCampResponse{
  bool success = 1;
}
message ListCampsRequest{}
message ListCampsResponse{
  repeated Camp camps = 1;
}
message CreateShiftRequest{
  string name = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  int32 capacity = 5;
  int32 price = 6;
  string camp_id = 7;
  Status status = 8;
}
message CreateShiftResponse{
  string id = 1;
}
message ListShiftsRequest{
  string camp_id = 1;
}
message ListShiftsResponse{
  repeated Shift shifts = 1;
}
message AssignRequest{
  string user_id = 1;
  string camp_id = 2;
}
message AssignResponse{
  bool success = 1;
}
service CampAdmin{
  rpc Assign(AssignRequest) returns (AssignResponse);

  rpc CreateCamp(CreateCampRequest) returns (CreateCampResponse);

  rpc DeleteCamp(DeleteCampRequest) returns (DeleteCampResponse);

  rpc GetCamp(GetCampRequest) returns (GetCampResponse);

  rpc UpdateCamp(UpdateCampRequest) returns (UpdateCampResponse);

  rpc ListCamps(ListCampsRequest) returns (ListCampsResponse);

  rpc CreateShift(CreateShiftRequest) returns (CreateShiftResponse);

  rpc ListShifts(ListShiftsRequest) returns (ListShiftsResponse);


}