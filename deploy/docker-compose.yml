version: '3.8'

services:

  nginx:
    image: nginx:latest
    restart: unless-stopped
    container_name: camp_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - camp_network

  api-gateway:
    build:
      context: ../
      dockerfile: services/api-gateway/Dockerfile
    container_name: api_gateway
    environment:
      - AUTH_SERVICE_ADDR=auth-service:50051
      - ADMIN_SERVICE_ADDR=admin-service:50051
    depends_on:
      - auth-service
      - admin-service
    networks:
      - camp_network


  auth-service:
    build:
      context: ../
      dockerfile: services/auth-service/Dockerfile
    container_name: auth_service
    environment:
      - DB_SOURCE=postgres://camp:camp@postgres:5432/auth_db?sslmode=disable
    networks:
      - camp_network

  admin-service:
    build:
      context: ../
      dockerfile: services/admin/Dockerfile
    container_name: admin_service
    environment:
      - DB_SOURCE=postgres://camp:camp@postgres:5432/admin_db?sslmode=disable
    networks:
      - camp_network

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    container_name: camp_postgres
    environment:
      - POSTGRES_USER=camp
      - POSTGRES_PASSWORD=camp
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - camp_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: camp_redis
    networks:
      - camp_network

  kafka:
    image: confluentinc/cp-kafka:latest
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - camp_network

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - camp_network

networks:
  camp_network:
    driver: bridge

volumes:
  pgdata: