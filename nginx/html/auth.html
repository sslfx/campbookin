<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход / Регистрация - CampBooking</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --secondary: #004E89;
            --accent: #FFD23F;
            --dark: #1A1D29;
            --light: #F7F9FC;
            --success: #06D6A0;
            --error: #EF476F;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: linear-gradient(135deg, var(--secondary) 0%, #003D6D 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .auth-container {
            background: white;
            border-radius: 32px;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            position: relative;
        }

        .auth-side {
            padding: 4rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .auth-side::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .auth-side-content {
            position: relative;
            z-index: 1;
        }

        .logo {
            font-family: 'Bebas Neue', cursive;
            font-size: 3rem;
            letter-spacing: 2px;
            margin-bottom: 2rem;
        }

        .auth-side h2 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .auth-side p {
            font-size: 1.1rem;
            opacity: 0.95;
            line-height: 1.6;
        }

        .auth-form-container {
            padding: 4rem;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 3rem;
            border-bottom: 2px solid var(--light);
        }

        .tab {
            flex: 1;
            padding: 1rem;
            background: none;
            border: none;
            font-family: 'Manrope', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            color: var(--secondary);
            border-bottom-color: var(--primary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            font-family: 'Manrope', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .form-group input::placeholder {
            color: #9CA3AF;
        }

        .btn-submit {
            width: 100%;
            padding: 1.2rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Manrope', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
        }

        .btn-submit:hover {
            background: #FF5722;
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(255, 107, 53, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            background: #CCC;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .alert-success {
            background: rgba(6, 214, 160, 0.1);
            color: var(--success);
            border: 2px solid var(--success);
        }

        .alert-error {
            background: rgba(239, 71, 111, 0.1);
            color: var(--error);
            border: 2px solid var(--error);
        }

        .divider {
            text-align: center;
            margin: 2rem 0;
            color: #999;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #E5E7EB;
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .forgot-password {
            text-align: right;
            margin-top: 1rem;
        }

        .forgot-password a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.95rem;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 2rem;
        }

        .back-home a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 600;
        }

        .back-home a:hover {
            color: var(--primary);
        }

        @media (max-width: 968px) {
            .auth-container {
                grid-template-columns: 1fr;
            }

            .auth-side {
                display: none;
            }

            .auth-form-container {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const API_BASE = '/api';

        function AuthPage() {
            const [activeTab, setActiveTab] = useState('login');
            const [formData, setFormData] = useState({
                email: '',
                password: '',
                name: ''
            });
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState({ type: '', text: '' });

            const handleChange = (e) => {
                setFormData({
                    ...formData,
                    [e.target.name]: e.target.value
                });
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setMessage({ type: '', text: '' });

                try {
                    const response = await fetch(`${API_BASE}/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email: formData.email,
                            password: formData.password
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        localStorage.setItem('token', data.token);
                        setMessage({ type: 'success', text: '✅ Успешный вход! Перенаправление...' });
                        setTimeout(() => {
                            window.location.href = '/dashboard.html';
                        }, 1500);
                    } else {
                        setMessage({ type: 'error', text: `❌ ${data.error || 'Ошибка входа'}` });
                    }
                } catch (error) {
                    setMessage({ type: 'error', text: '❌ Ошибка подключения к серверу' });
                } finally {
                    setLoading(false);
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                setLoading(true);
                setMessage({ type: '', text: '' });

                if (!formData.name || !formData.email || !formData.password) {
                    setMessage({ type: 'error', text: '❌ Заполните все поля' });
                    setLoading(false);
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE}/registration`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            name: formData.name,
                            email: formData.email,
                            password: formData.password
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        setMessage({ type: 'success', text: '✅ Регистрация успешна! Теперь войдите.' });
                        setTimeout(() => {
                            setActiveTab('login');
                            setFormData({ email: formData.email, password: '', name: '' });
                        }, 2000);
                    } else {
                        setMessage({ type: 'error', text: `❌ ${data.error || 'Ошибка регистрации'}` });
                    }
                } catch (error) {
                    setMessage({ type: 'error', text: '❌ Ошибка подключения к серверу' });
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="auth-container">
                    <div className="auth-side">
                        <div className="auth-side-content">
                            <div className="logo">🏕️ CampBooking</div>
                            <h2>Добро пожаловать!</h2>
                            <p>
                                Войдите в личный кабинет, чтобы управлять бронированиями 
                                и следить за путёвками ваших детей.
                            </p>
                        </div>
                    </div>

                    <div className="auth-form-container">
                        <div className="tabs">
                            <button
                                className={`tab ${activeTab === 'login' ? 'active' : ''}`}
                                onClick={() => setActiveTab('login')}
                            >
                                Вход
                            </button>
                            <button
                                className={`tab ${activeTab === 'register' ? 'active' : ''}`}
                                onClick={() => setActiveTab('register')}
                            >
                                Регистрация
                            </button>
                        </div>

                        {message.text && (
                            <div className={`alert alert-${message.type}`}>
                                {message.text}
                            </div>
                        )}

                        {activeTab === 'login' ? (
                            <form onSubmit={handleLogin}>
                                <div className="form-group">
                                    <label>Email</label>
                                    <input
                                        type="email"
                                        name="email"
                                        placeholder="your@email.com"
                                        value={formData.email}
                                        onChange={handleChange}
                                        required
                                    />
                                </div>

                                <div className="form-group">
                                    <label>Пароль</label>
                                    <input
                                        type="password"
                                        name="password"
                                        placeholder="••••••••"
                                        value={formData.password}
                                        onChange={handleChange}
                                        required
                                    />
                                </div>

                                <div className="forgot-password">
                                    <a href="#">Забыли пароль?</a>
                                </div>

                                <button
                                    type="submit"
                                    className="btn-submit"
                                    disabled={loading}
                                >
                                    {loading ? '⏳ Вход...' : '🔑 Войти'}
                                </button>
                            </form>
                        ) : (
                            <form onSubmit={handleRegister}>
                                <div className="form-group">
                                    <label>Ваше имя</label>
                                    <input
                                        type="text"
                                        name="name"
                                        placeholder="Иван Иванов"
                                        value={formData.name}
                                        onChange={handleChange}
                                        required
                                    />
                                </div>

                                <div className="form-group">
                                    <label>Email</label>
                                    <input
                                        type="email"
                                        name="email"
                                        placeholder="your@email.com"
                                        value={formData.email}
                                        onChange={handleChange}
                                        required
                                    />
                                </div>

                                <div className="form-group">
                                    <label>Пароль</label>
                                    <input
                                        type="password"
                                        name="password"
                                        placeholder="Минимум 8 символов"
                                        value={formData.password}
                                        onChange={handleChange}
                                        required
                                        minLength="8"
                                    />
                                </div>

                                <button
                                    type="submit"
                                    className="btn-submit"
                                    disabled={loading}
                                >
                                    {loading ? '⏳ Регистрация...' : '📝 Зарегистрироваться'}
                                </button>
                            </form>
                        )}

                        <div className="back-home">
                            <a href="/">← Вернуться на главную</a>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<AuthPage />, document.getElementById('root'));
    </script>
</body>
</html>
