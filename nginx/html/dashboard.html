<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - CampBooking</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --secondary: #004E89;
            --accent: #FFD23F;
            --dark: #1A1D29;
            --light: #F7F9FC;
            --success: #06D6A0;
            --error: #EF476F;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: var(--light);
            color: var(--dark);
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background: var(--dark);
            color: white;
            padding: 2rem;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .logo {
            font-family: 'Bebas Neue', cursive;
            font-size: 2rem;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 3rem;
        }

        .user-info {
            background: rgba(255,255,255,0.05);
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 2rem;
        }

        .user-info h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .user-role {
            display: inline-block;
            background: var(--accent);
            color: var(--dark);
            padding: 0.3rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .nav-menu {
            list-style: none;
        }

        .nav-item {
            margin-bottom: 0.5rem;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s;
            font-weight: 500;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .nav-link.active {
            background: var(--primary);
        }

        .logout-btn {
            width: 100%;
            padding: 1rem;
            background: var(--error);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 2rem;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #D03A5D;
        }

        /* MAIN CONTENT */
        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 2rem;
        }

        .header {
            background: white;
            padding: 2rem;
            border-radius: 24px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .header h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: 2.5rem;
            color: var(--secondary);
            letter-spacing: 1px;
        }

        .header p {
            color: #666;
            margin-top: 0.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: #666;
            font-size: 0.95rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .card-title {
            font-family: 'Bebas Neue', cursive;
            font-size: 1.8rem;
            color: var(--secondary);
            letter-spacing: 1px;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Manrope', sans-serif;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #FF5722;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--light);
            color: var(--secondary);
        }

        .table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 0.5rem;
        }

        .table thead th {
            text-align: left;
            padding: 1rem;
            color: #666;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table tbody tr {
            background: var(--light);
            transition: all 0.3s;
        }

        .table tbody tr:hover {
            background: #E8EBF0;
            transform: scale(1.01);
        }

        .table tbody td {
            padding: 1.5rem 1rem;
        }

        .table tbody tr td:first-child {
            border-radius: 12px 0 0 12px;
        }

        .table tbody tr td:last-child {
            border-radius: 0 12px 12px 0;
        }

        .badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge-success {
            background: rgba(6, 214, 160, 0.1);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(255, 210, 63, 0.2);
            color: #D4A514;
        }

        .badge-error {
            background: rgba(239, 71, 111, 0.1);
            color: var(--error);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--dark);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 1rem;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            font-family: 'Manrope', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: white;
            padding: 2.5rem;
            border-radius: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .modal-title {
            font-family: 'Bebas Neue', cursive;
            font-size: 2rem;
            color: var(--secondary);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2rem;
            color: #999;
            cursor: pointer;
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: var(--light);
            color: var(--dark);
        }

        @media (max-width: 968px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_BASE = '/api';

        function Dashboard() {
            const [user, setUser] = useState({ name: 'Родитель', role: 'parent' });
            const [activeSection, setActiveSection] = useState('overview');
            const [camps, setCamps] = useState([]);
            const [bookings, setBookings] = useState([]);
            const [showModal, setShowModal] = useState(false);
            const [formData, setFormData] = useState({
                name: '',
                description: '',
                address: ''
            });

            useEffect(() => {
                const token = localStorage.getItem('token');
                if (!token) {
                    window.location.href = '/auth.html';
                    return;
                }
                fetchData();
            }, []);

            const fetchData = async () => {
                try {
                    const token = localStorage.getItem('token');
                    // Fetch camps
                    const campsRes = await fetch(`${API_BASE}/camps`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    if (campsRes.ok) {
                        const data = await campsRes.json();
                        setCamps(data.camps || []);
                    }
                } catch (error) {
                    console.error('Error fetching data:', error);
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('token');
                window.location.href = '/auth.html';
            };

            const handleCreateCamp = async (e) => {
                e.preventDefault();
                try {
                    const token = localStorage.getItem('token');
                    const response = await fetch(`${API_BASE}/camps`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(formData)
                    });

                    if (response.ok) {
                        alert('✅ Лагерь успешно создан!');
                        setShowModal(false);
                        setFormData({ name: '', description: '', address: '' });
                        fetchData();
                    } else {
                        alert('❌ Ошибка создания лагеря');
                    }
                } catch (error) {
                    alert('❌ Ошибка подключения');
                }
            };

            const renderAdminOverview = () => (
                <>
                    <div className="stats-grid">
                        <div className="stat-card">
                            <div className="stat-icon">🏕️</div>
                            <div className="stat-value">{camps.length}</div>
                            <div className="stat-label">Всего лагерей</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon">📅</div>
                            <div className="stat-value">24</div>
                            <div className="stat-label">Активных смен</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon">👥</div>
                            <div className="stat-value">348</div>
                            <div className="stat-label">Бронирований</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon">💰</div>
                            <div className="stat-value">12.5M</div>
                            <div className="stat-label">Выручка (₽)</div>
                        </div>
                    </div>

                    <div className="card">
                        <div className="card-header">
                            <h2 className="card-title">Лагеря</h2>
                            <button className="btn btn-primary" onClick={() => setShowModal(true)}>
                                + Создать лагерь
                            </button>
                        </div>

                        <table className="table">
                            <thead>
                                <tr>
                                    <th>Название</th>
                                    <th>Адрес</th>
                                    <th>Смены</th>
                                    <th>Статус</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                {camps.map((camp, idx) => (
                                    <tr key={idx}>
                                        <td><strong>{camp.name}</strong></td>
                                        <td>{camp.address}</td>
                                        <td>5 смен</td>
                                        <td><span className="badge badge-success">Активен</span></td>
                                        <td>
                                            <button className="btn btn-secondary">Редактировать</button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </>
            );

            const renderParentOverview = () => (
                <>
                    <div className="stats-grid">
                        <div className="stat-card">
                            <div className="stat-icon">🎫</div>
                            <div className="stat-value">2</div>
                            <div className="stat-label">Активных бронирований</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon">👶</div>
                            <div className="stat-value">3</div>
                            <div className="stat-label">Детей</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon">📅</div>
                            <div className="stat-value">14</div>
                            <div className="stat-label">Дней до начала</div>
                        </div>
                    </div>

                    <div className="card">
                        <div className="card-header">
                            <h2 className="card-title">Мои бронирования</h2>
                            <button className="btn btn-primary">+ Забронировать</button>
                        </div>

                        <table className="table">
                            <thead>
                                <tr>
                                    <th>Лагерь</th>
                                    <th>Ребёнок</th>
                                    <th>Даты</th>
                                    <th>Статус</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><strong>Зарница</strong></td>
                                    <td>Максим И.</td>
                                    <td>01.06 - 21.06</td>
                                    <td><span className="badge badge-success">Оплачено</span></td>
                                    <td>
                                        <button className="btn btn-secondary">Путёвка PDF</button>
                                    </td>
                                </tr>
                                <tr>
                                    <td><strong>Орлёнок</strong></td>
                                    <td>Анна И.</td>
                                    <td>15.07 - 05.08</td>
                                    <td><span className="badge badge-warning">Ожидание</span></td>
                                    <td>
                                        <button className="btn btn-primary">Оплатить</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </>
            );

            return (
                <div className="dashboard">
                    <div className="sidebar">
                        <div className="logo">🏕️ CampBooking</div>

                        <div className="user-info">
                            <h3>{user.name}</h3>
                            <span className="user-role">
                                {user.role === 'admin' ? '👑 Администратор' : '👤 Родитель'}
                            </span>
                        </div>

                        <ul className="nav-menu">
                            <li className="nav-item">
                                <a
                                    href="#"
                                    className={`nav-link ${activeSection === 'overview' ? 'active' : ''}`}
                                    onClick={() => setActiveSection('overview')}
                                >
                                    📊 Обзор
                                </a>
                            </li>
                            {user.role === 'admin' ? (
                                <>
                                    <li className="nav-item">
                                        <a href="#" className="nav-link">🏕️ Лагеря</a>
                                    </li>
                                    <li className="nav-item">
                                        <a href="#" className="nav-link">📅 Смены</a>
                                    </li>
                                    <li className="nav-item">
                                        <a href="#" className="nav-link">👥 Бронирования</a>
                                    </li>
                                </>
                            ) : (
                                <>
                                    <li className="nav-item">
                                        <a href="#" className="nav-link">🎫 Мои бронирования</a>
                                    </li>
                                    <li className="nav-item">
                                        <a href="#" className="nav-link">👶 Дети</a>
                                    </li>
                                    <li className="nav-item">
                                        <a href="#" className="nav-link">🔍 Найти лагерь</a>
                                    </li>
                                </>
                            )}
                            <li className="nav-item">
                                <a href="#" className="nav-link">⚙️ Настройки</a>
                            </li>
                        </ul>

                        <button className="logout-btn" onClick={handleLogout}>
                            🚪 Выйти
                        </button>
                    </div>

                    <div className="main-content">
                        <div className="header">
                            <h1>{user.role === 'admin' ? 'Панель администратора' : 'Личный кабинет'}</h1>
                            <p>Добро пожаловать, {user.name}!</p>
                        </div>

                        {user.role === 'admin' ? renderAdminOverview() : renderParentOverview()}
                    </div>

                    {showModal && (
                        <div className="modal-overlay" onClick={() => setShowModal(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h2 className="modal-title">Создать лагерь</h2>
                                    <button className="close-btn" onClick={() => setShowModal(false)}>
                                        ×
                                    </button>
                                </div>

                                <form onSubmit={handleCreateCamp}>
                                    <div className="form-group">
                                        <label>Название лагеря</label>
                                        <input
                                            type="text"
                                            value={formData.name}
                                            onChange={(e) => setFormData({...formData, name: e.target.value})}
                                            required
                                            placeholder="Например: Зарница"
                                        />
                                    </div>

                                    <div className="form-group">
                                        <label>Описание</label>
                                        <textarea
                                            rows="4"
                                            value={formData.description}
                                            onChange={(e) => setFormData({...formData, description: e.target.value})}
                                            required
                                            placeholder="Краткое описание лагеря..."
                                        ></textarea>
                                    </div>

                                    <div className="form-group">
                                        <label>Адрес</label>
                                        <input
                                            type="text"
                                            value={formData.address}
                                            onChange={(e) => setFormData({...formData, address: e.target.value})}
                                            required
                                            placeholder="Московская область, пос. Лесной"
                                        />
                                    </div>

                                    <button type="submit" className="btn btn-primary" style={{width: '100%'}}>
                                        ✅ Создать лагерь
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
